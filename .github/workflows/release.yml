name: Release

# Pushing a tag like v1.2.0 builds the exe and publishes it as a GitHub release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # self-contained: runs on a clean Windows, no .NET install needed
      - name: Publish
        shell: pwsh
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=$($env:TAG.TrimStart('v'))
          -o out

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG out/DynamicIsland.exe --title "Dynamic Island $env:TAG" --generate-notes
